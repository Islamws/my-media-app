name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create . --platforms=android --org com.islamws --project-name all_in_one
      - name: Patch Android project
        run: python3 tools/patch_android.py
      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm64 --no-shrink 
      - uses: actions/upload-artifact@v4
        with:
          name: all-in-one-apk
          path: build/app/outputs/flutter-apk/app-release.apk
